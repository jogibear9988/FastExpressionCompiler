name: Diagnose switch conversion
on:
  push:
    branches: [debug/switch-conversion-ci]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet --info && dotnet --list-runtimes
      - run: dotnet build -c Release
      - name: Reproduce full .NET 8 runner
        run: dotnet run --no-build -c Release -f net8.0 --project test/FastExpressionCompiler.TestsRunner
